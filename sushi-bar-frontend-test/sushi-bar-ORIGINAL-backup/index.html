<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seaside Sushi Bar · Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <main class="auth">
    <section class="auth-hero">
      <div class="noren noren-hero" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1 class="brand-title">Seaside<br>Sushi Bar</h1>
      <p class="auth-tagline">The ocean’s regulars are hungry. Read their orders, build the dish, and keep the fish coming.</p>
      <div class="conveyor" aria-hidden="true">
        <div class="conveyor-track">
          <span>🍣</span><span>🍙</span><span>🍳</span><span>🍱</span><span>🥒</span><span>🍣</span><span>🍙</span><span>🍳</span>
          <span>🍣</span><span>🍙</span><span>🍳</span><span>🍱</span><span>🥒</span><span>🍣</span><span>🍙</span><span>🍳</span>
        </div>
      </div>
    </section>

    <section class="auth-card" aria-label="Account">
      <div class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="login" aria-controls="login-form" aria-selected="true">Log in</button>
        <button role="tab" type="button" data-tab="signup" aria-controls="signup-form" aria-selected="false">Create account</button>
      </div>

      <p id="auth-error" class="form-error" role="alert" hidden></p>

      <form id="login-form" class="form" autocomplete="on">
        <label>Username <input name="username" required autocomplete="username" maxlength="30"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>

      <form id="signup-form" class="form" hidden autocomplete="on">
        <label>Username <input name="username" required autocomplete="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" title="3–30 letters, numbers or underscores"></label>
        <label>Email <span class="hint">Only used to reset your password</span><input name="email" type="email" required autocomplete="email"></label>
        <label>Password <span class="hint">At least 8 characters</span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm password <input name="confirm" type="password" required autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>

      <p id="demo-note" class="demo-note" hidden>Demo mode: no PHP backend was found, so any username works and nothing is stored on a server.</p>
    </section>
  </main>
  <div id="demo-badge" class="demo-badge" hidden>Demo mode</div>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
